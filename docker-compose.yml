services:
  # Monitoring System Service
  monitoring_system:
    build:
      context: ./monitoring_system
      dockerfile: Dockerfile
    container_name: monitoring_system
    env_file:
      - ./monitoring_system/.env
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      monitoring_db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${MONITORING_POSTGRES_USER:-postgres}:${MONITORING_POSTGRES_PASSWORD:-postgres}@monitoring_db:5432/${MONITORING_POSTGRES_DB:-monitoring_db}

  # Monitoring System Database
  monitoring_db:
    image: postgres:16-alpine
    container_name: monitoring_db
    environment:
      POSTGRES_USER: ${MONITORING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MONITORING_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${MONITORING_POSTGRES_DB:-monitoring_db}
    ports:
      - "5433:5432"
    volumes:
      - monitoring_pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
  # Server Service (Monitored Application)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    networks:
      - app_network
    depends_on:
      server_db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SERVER_POSTGRES_USER:-postgres}:${SERVER_POSTGRES_PASSWORD:-postgres}@server_db:5432/${SERVER_POSTGRES_DB:-server_db}
      - MONITORING_SYSTEM_URL=http://monitoring_system:8000

  # Server Database
  server_db:
    image: postgres:16-alpine
    container_name: server_db
    environment:
      POSTGRES_USER: ${SERVER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SERVER_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${SERVER_POSTGRES_DB:-server_db}
    ports:
      - "5434:5432"
    volumes:
      - server_pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  monitoring_pgdata:
  server_pgdata:


services:
  # Monitoring System Service
  monitoring_system:
    build:
      context: ./monitoring_system
      dockerfile: Dockerfile
    container_name: monitoring_system
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - app_network
    volumes:
      - ./alembic:/app/alembic
    depends_on:
      - monitoring_db
    environment:
       DATABASE_URL: postgresql+asyncpg://${MONITORING_DB_USER}:${MONITORING_DB_PASSWORD}@monitoring_db:${MONITORING_DB_PORT}/${MONITORING_DB_DATABASE}
    restart: unless-stopped

  # Monitoring System Database
  monitoring_db:
    image: postgres:16-alpine
    container_name: monitoring_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${MONITORING_DB_USER}
      POSTGRES_PASSWORD: ${MONITORING_DB_PASSWORD}
      POSTGRES_DB: ${MONITORING_DB_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - monitoring_pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
  # Server Service (Monitored Application)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    volumes:
      - ./alembic:/app/alembic
    networks:
      - app_network
    depends_on:
      - server_db
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${SERVER_DB_USER}:${SERVER_DB_PASSWORD}@server_db:${SERVER_DB_PORT}/${SERVER_DB_DATABASE}
      MONITORING_SYSTEM_URL: http://monitoring_system:8000

  # Server Database
  server_db:
    image: postgres:16-alpine
    container_name: server_db
    env_file:
        - .env
    environment:
      POSTGRES_USER: ${SERVER_DB_USER}
      POSTGRES_PASSWORD: ${SERVER_DB_PASSWORD}
      POSTGRES_DB: ${SERVER_DB_DATABASE}
    ports:
      - "5434:5432"
    volumes:
      - server_pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  monitoring_pgdata:
  server_pgdata:
